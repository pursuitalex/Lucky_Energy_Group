<main id="main" class="cart-page">

  <section class="page-head page-head--compact">
    <div class="container">
      <nav aria-label="Хлібні крихти"><ol class="breadcrumbs"><li><a href="index.html">Головна</a></li><li aria-current="page">Замовлення прийнято</li></ol></nav>
      <div class="page-head__row">
        <h1 class="t-h1">Дякуємо! <span class="t-dim" id="order-h1">Замовлення прийнято</span></h1>
        <ol class="steps order-steps" aria-label="Етапи замовлення"><li class="is-done">1. Кошик</li><li class="is-done">2. Оформлення</li><li aria-current="step">3. Готово</li></ol>
      </div>
    </div>
  </section>

  <div class="container cart" id="order">
    <div class="order">
      <div class="alert alert--success order__status">
        <svg class="icon" aria-hidden="true"><use href="#i-tick"/></svg>
        <div><strong id="order-status-title">Замовлення прийнято</strong><span class="t-body-sm c-secondary" id="order-status-text">Підтвердження надіслали на вашу пошту.</span></div>
      </div>

      <h2 class="t-h3">Що буде далі</h2>
      <ol class="order-next" id="order-next"></ol>

      <div class="cluster">
        <a href="catalog.html" class="btn btn--primary btn--lg">Повернутися в каталог</a>
        <a href="index.html" class="btn btn--secondary btn--lg">На головну</a>
      </div>
    </div>

    <aside class="summary" aria-labelledby="order-summary-title">
      <div class="summary__head"><h2 class="t-h4" id="order-summary-title">Замовлення</h2><span class="summary__edit" id="order-number"></span></div>
      <ul class="summary__items" id="co-items"></ul>
      <dl class="summary__rows" id="order-details"></dl>
      <div class="summary__total"><span>Разом</span><strong id="sum-total"></strong></div>
    </aside>
  </div>
</main>
